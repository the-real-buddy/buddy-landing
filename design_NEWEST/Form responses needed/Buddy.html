document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: #d8d5ca transparent; }\n  *::-webkit-scrollbar { width: 8px; height: 8px; }\n  *::-webkit-scrollbar-track { background: transparent; }\n  *::-webkit-scrollbar-thumb { background: #d8d5ca; border-radius: 100px; border: 2px solid transparent; background-clip: padding-box; }\n  *::-webkit-scrollbar-thumb:hover { background: #c4c1b6; border: 2px solid transparent; background-clip: padding-box; }\n  @keyframes sectin { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }\n  .landsect { animation: sectin .6s cubic-bezier(.3,.9,.2,1) both; animation-timeline: view(); animation-range: entry 0% entry 42%; }\n  @container (max-width: 760px) {\n    .landsect { grid-template-columns: minmax(0, 1fr) !important; gap: 28px !important; }\n    .landsect > * { order: 0 !important; }\n    .cchead { grid-template-columns: minmax(0, 1fr) !important; gap: 14px !important; }\n    .ccpanes { grid-template-columns: minmax(0, 1fr) !important; }\n    .ccleft { border-right: none !important; border-bottom: 1px solid #efece4; }\n  }\n  .landcard { transition: transform .22s cubic-bezier(.3,.9,.2,1), box-shadow .22s; }\n  .landcard:hover { transform: translateY(-3px); box-shadow: 0 1px 2px rgba(28,27,24,.04), 0 28px 60px -32px rgba(28,27,24,.32) !important; }\n  .chev { display: inline-block; transition: transform .18s cubic-bezier(.3,.9,.2,1); }\n  @keyframes barin { from { transform: scaleY(0); } }\n  .barin { transform-origin: bottom; animation: barin .5s cubic-bezier(.3,.9,.2,1) both; }\n  @keyframes viewin { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }\n  .viewin { animation: viewin .18s cubic-bezier(.3,.9,.2,1) both; }\n  .feed { overflow-x: hidden; }\n  .feed * { overflow-wrap: anywhere; }\n  .fsrow .fsdel { opacity: 0; transition: opacity .12s; }\n  .fsrow:hover .fsdel, .fsrow .fsdel[data-armed=\"true\"] { opacity: 1; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ legalView }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-legalscroll=\"1\" style=\"height: 100vh; overflow-y: auto; background: #f7f6f1\">\n    <div style=\"position: sticky; top: 0; z-index: 50; background: color-mix(in oklch, #f7f6f1 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid #e6e3da\">\n      <div style=\"max-width: 1060px; margin: 0 auto; padding: 14px 48px; display: flex; align-items: center; gap: 18px\">\n        <span sc-camel-on-click=\"{{ closeLegal }}\" style=\"display: flex; align-items: center; gap: 10px; cursor: pointer\">\n          <span style=\"font-size: 13px; color: #97948a\">←<\u002Fspan>\n          <span style=\"font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #97948a\">buddy<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex: 1\"><\u002Fspan>\n        <sc-for list=\"{{ legalTabs }}\" as=\"t\" hint-placeholder-count=\"2\"><span sc-camel-on-click=\"{{ t.go }}\" style=\"font-size: 11.5px; cursor: pointer; color: {{ t.color }}\" style-hover=\"color: #1c1b18\">{{ t.name }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"viewin\" style=\"max-width: 1060px; margin: 0 auto; padding: 72px 48px 40px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 64px; align-items: start\">\n      <nav style=\"position: sticky; top: 96px; display: flex; flex-direction: column; gap: 9px\">\n        <span style=\"font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #97948a; margin-bottom: 4px\">contents<\u002Fspan>\n        <sc-for list=\"{{ legalSecs }}\" as=\"c\" hint-placeholder-count=\"6\"><span sc-camel-on-click=\"{{ c.jump }}\" style=\"display: grid; grid-template-columns: 22px 1fr; font-size: 11.5px; line-height: 1.5; color: #54524b; cursor: pointer\" style-hover=\"color: #1c1b18\"><span style=\"color: #97948a; font-variant-numeric: tabular-nums\">{{ c.n }}<\u002Fspan>{{ c.h }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fnav>\n      <article style=\"max-width: 640px color: #97948a\">·<\u002Fspan>{{ li }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fsc-for>\n        <section style=\"padding: 28px 0; border-top: 1px solid #e6e3da\">\n          <h2 style=\"margin: 0 0 12px; font-weight: 500; font-size: 17px; letter-spacing: -0.01em\">questions<\u002Fh2>\n          <p style=\"margin: 0; font-size: 12.5px; line-height: 1.8; color: #54524b\">write to <a href=\"mailto:[legal@yourdomain]\" style=\"color: oklch(0.55 0.075 150)\">[legal@yourdomain]<\u002Fa> or [company legal name], [street address], [city, region, postal code], [country].<\u002Fp>\n        <\u002Fsection>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <div style=\"max-width: 1060px; margin: 0 auto; padding: 0 48px\">\n      <footer style=\"border-top: 1px solid #e6e3da; padding: 22px 0 34px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; font-size: 11px; color: #97948a\">\n        <span>© 2026 buddy<\u002Fspan>\n        <span style=\"flex: 1\"><\u002Fspan>\n        <span sc-camel-on-click=\"{{ goPrivacy }}\" style=\"color: #97948a; text-decoration: none; cursor: pointer\" style-hover=\"color: #1c1b18\">privacy<\u002Fspan>\n        <span sc-camel-on-click=\"{{ goTerms }}\" style=\"color: #97948a; text-decoration: none; cursor: pointer\" style-hover=\"color: #1c1b18\">terms<\u002Fspan>\n        <a href=\"mailto:hello@buddy.work\" style=\"color: #97948a; text-decoration: none; cursor: pointer\" style-hover=\"color: #1c1b18\">contact us<\u002Fa>\n      <\u002Ffooter>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ landingView }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"height: 100vh; display: flex; flex-direction: column; background: {{ lpOuterBg }}\">\n    <div style=\"flex-shrink: 0; background: #f7f6f1; margin: 0 auto; width: 100%; max-width: {{ lpMax }}; border-left: {{ lpEdge }}; border-right: {{ lpEdge }}; box-sizing: border-box; border-bottom: 1px solid #e6e3da\">\n      <div style=\"max-width: 1060px; margin: 0 auto; padding: 14px 48px; display: flex; align-items: center; justify-content: space-between\">\n        <span style=\"display: flex; align-items: center; gap: 10px\">\n          <span style=\"position: relative; display: inline-grid; place-items: center; width: 26px; height: 26px\"><span style=\"font-weight: 700; font-size: 18px; letter-spacing: -0.04em\">b<\u002Fspan><span style=\"position: absolute; top: -1px; right: -4px; width: 5px; height: 5px; border-radius: 50%; background: oklch(0.55 0.075 150); animation: ping 2.4s cubic-bezier(.4,0,.2,1) infinite\"><\u002Fspan><\u002Fspan>\n          <span style=\"font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #97948a\">buddy<\u002Fspan>\n        <\u002Fspan>\n        <span sc-camel-on-click=\"{{ enterApp }}\" style=\"font-size: 12px; color: #54524b; cursor: pointer; border: 1px solid #e6e3da; background: #fdfcf9; padding: 6px 15px; border-radius: 100px\" style-hover=\"border-color: #c4c1b6; color: #1c1b18\">sign in<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <div data-lpscroll=\"1\" style=\"flex: 1; min-height: 0; overflow-y: auto\">\n  <div class=\"lpwrap\" style=\"container-type: inline-size; background: #f7f6f1; margin: 0 auto; max-width: {{ lpMax }}; min-height: 100%; border-left: {{ lpEdge }}; border-right: {{ lpEdge }}\">\n\n\n    <div style=\"max-width: 1060px; margin: 0 auto; padding: 0 48px\">\n\n      <div class=\"viewin\" style=\"padding: 104px 0 88px\">\n        <h1 style=\"margin: 0 0 20px; font-weight: 500; font-size: 48px; line-height: 1.08; letter-spacing: -0.03em; max-width: 820px; text-wrap: pretty\">a digital intern<br>still on the job next week.<span style=\"display: inline-block; width: 11px; height: 0.88em; vertical-align: -0.06em; background: oklch(0.55 0.075 150); margin-left: 7px; animation: blink 1.2s steps(1) infinite\"><\u002Fspan><\u002Fh1>\n        <p style=\"margin: 0 0 30px; font-size: 14px; line-height: 1.8; color: #54524b; max-width: 520px; text-wrap: pretty\">buddy works on a real computer, learns how your team does things, asks before anything leaves your account, and asks when it's stuck.<\u002Fp>\n        <div style=\"display: flex; align-items: center; gap: 14px\">\n          <span sc-camel-on-click=\"{{ enterApp }}\" style=\"display: inline-flex; align-items: center; gap: 9px; font-size: 13px; border: 1px solid oklch(0.55 0.075 150); background: oklch(0.55 0.075 150); color: #fdfcf9; padding: 11px 24px; border-radius: 100px; cursor: pointer; box-shadow: 0 1px 2px rgba(28,27,24,.06), 0 8px 22px -12px oklch(0.55 0.075 150 / 0.55)\" style-hover=\"background: #1c1b18; border-color: #1c1b18\"><span style=\"font-size: 9px\">▶<\u002Fspan>get started<\u002Fspan>\n                  <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"landsect\" style=\"padding: 0 0 96px\">\n        <div class=\"cchead\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 72px; align-items: end; margin-bottom: 32px\">\n          <div>\n            <span style=\"display: block; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.55 0.075 150); margin-bottom: 14px\">its own inbox<\u002Fspan>\n            <h2 style=\"margin: 0; font-weight: 500; font-size: 30px; letter-spacing: -0.025em; line-height: 1.15\">cc it like anyone else.<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 12.5px; line-height: 1.8; color: #54524b; text-wrap: pretty\">it has its own email and slack. clients, vendors and your team write to it like a coworker. your team can hand it work directly. anything going to someone outside waits for the right person to say yes.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"landcard\" style=\"border: 1px solid #c4c1b6; border-radius: 10px; background: #fdfcf9; overflow: hidden\">\n          <div class=\"nosb\" data-cctabs=\"1\" style=\"position: relative; display: flex; gap: 24px; padding: 0 22px; box-shadow: inset 0 -1px 0 #e6e3da; overflow-x: auto; overflow-y: hidden; scrollbar-width: none\">\n            <sc-for list=\"{{ ccTabs }}\" as=\"t\" hint-placeholder-count=\"4\"><span sc-camel-on-click=\"{{ t.go }}\" style=\"flex-shrink: 0; font-size: 12px; padding: 13px 0 12px; cursor: pointer; white-space: nowrap; color: {{ t.color }}; border-bottom: 2px solid {{ t.line }}\" style-hover=\"color: #1c1b18\">{{ t.name }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"ccpanes\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 300px\">\n            <div class=\"ccleft\" style=\"padding: 20px 24px 24px; border-right: 1px solid #efece4; display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n              <span style=\"font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #97948a\">came in · {{ cs.via }}<\u002Fspan>\n              <div style=\"display: flex; flex-direction: column; gap: 5px\">\n                <sc-for list=\"{{ cs.head }}\" as=\"h\" hint-placeholder-count=\"3\">\n                  <div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; font-size: 11.5px; line-height: 1.6\"><span style=\"color: #97948a\">{{ h.k }}<\u002Fspan><span style=\"min-width: 0; overflow-wrap: anywhere\"><span style=\"color: {{ h.color }}; background: {{ h.bg }}; padding: {{ h.pad }}; border-radius: 4px\">{{ h.v }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; color: #1c1b18\">{{ cs.subject }}<\u002Fdiv>\n              <p style=\"margin: 0; font-size: 12px; line-height: 1.75; color: #54524b; text-wrap: pretty\">{{ cs.body }}<\u002Fp>\n              <sc-if value=\"{{ cs.hasFile }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: #54524b; border: 1px solid #e6e3da; padding: 4px 9px; border-radius: 6px\">▤ {{ cs.file }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"padding: 20px 24px 24px; background: #f7f6f1; display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n              <span style=\"font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #97948a\">what it did<\u002Fspan>\n              <p style=\"margin: 0; font-size: 12px; line-height: 1.7; color: #54524b; text-wrap: pretty\">{{ cs.note }}<\u002Fp>\n              <sc-if value=\"{{ cs.isDraft }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"border: 1px solid #e6e3da; background: #fdfcf9; border-radius: 8px; overflow: hidden\">\n                  <div style=\"padding: 9px 14px; border-bottom: 1px solid #efece4; font-size: 11px; color: #97948a\">{{ cs.draftTo }}<\u002Fdiv>\n                  <p style=\"margin: 0; padding: 12px 14px; font-size: 12px; line-height: 1.7; color: #1c1b18; text-wrap: pretty\">{{ cs.draft }}<\u002Fp>\n                  <div style=\"display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px solid #efece4; background: #f1efe8; flex-wrap: wrap\">\n                    <sc-if value=\"{{ cs.pending }}\" hint-placeholder-val=\"{{ true }}\">\n                      <span style=\"flex: 1; font-size: 11px; color: oklch(0.50 0.09 70)\">{{ cs.waitText }}<\u002Fspan>\n                      <span sc-camel-on-click=\"{{ cs.decline }}\" style=\"font-size: 11px; color: #97948a; cursor: pointer; border: 1px solid #e6e3da; background: #fdfcf9; padding: 3px 10px; border-radius: 5px\" style-hover=\"color: oklch(0.58 0.10 28); border-color: #c4c1b6\">decline<\u002Fspan>\n                      <span sc-camel-on-click=\"{{ cs.approve }}\" style=\"font-size: 11px; color: #f7f6f1; cursor: pointer; border: 1px solid #1c1b18; background: #1c1b18; padding: 3px 10px; border-radius: 5px\" style-hover=\"background: oklch(0.55 0.075 150); border-color: oklch(0.55 0.075 Fspan><span style=\"color: #97948a\">→<\u002Fspan><span>files / legal /<\u002Fspan><\u002Fdiv>\n                <div style=\"border: 1px solid oklch(0.66 0.085 75 / 0.45); background: #fdfcf9; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px\">\n                  <span style=\"font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.50 0.09 70)\">on your desk · needs you<\u002Fspan>\n                  <span style=\"font-size: 12.5px; color: #1c1b18\">sign the updated msa from fjord legal<\u002Fspan>\n                  <span style=\"font-size: 11px; line-height: 1.6; color: #54524b\">clause 7 changed from net 30 to net 45. everything else matches v2.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"landsect\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; padding: 72px 0; border-top: 1px solid #e6e3da\">\n        <div style=\"order: 2\">\n          <span style=\"display: block; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.55 0.075 150); margin-bottom: 14px\">show it once<\u002Fspan>\n          <h2 style=\"margin: 0 0 10px; font-weight: 500; font-size: 26px; letter-spacing: -0.02em; line-height: 1.2; text-wrap: pretty\">teach it the way the team does it.<\u002Fh2>\n          <p style=\"margin: 0 0 14px; font-size: 14px; line-height: 1.6; color: #1c1b18; text-wrap: pretty\">take over, do the task, hand back.<\u002Fp>\n          <p style=\"margin: 0; font-size: 12.5px; line-height: 1.8; color: #54524b; text-wrap: pretty\">do it yourself, say what matters as you go, hand back. buddy writes it down and does it that way next time. everything it learns, anyone on the team can read, edit or throw out.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"landcard\" style=\"border: 1px solid #c4c1b6; border-r 24b; background: #f1efe8\">set as inbox<\u002Fspan><\u002Fsc-if>\n                <span style=\"font-size: 10.5px; color: #97948a; flex-shrink: 0\">{{ p.when }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #97948a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ p.dir }}<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid #efece4; padding-top: 11px; font-size: 10.5px; color: #97948a\">\n                <span>{{ p.files }} files<\u002Fspan>\n                <span style=\"color: {{ p.stateColor }}\">{{ p.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div sc-camel-on-click=\"{{ startProject }}\" style=\"border: 1px dashed #e6e3da; border-radius: 9px; min-height: 128px; display: grid; place-items: center; cursor: pointer; color: #97948a; font-size: 11.5px; font-style: italic\" style-hover=\"border-color: #c4c1b6; color: #54524b\">new project<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n\n      <sc-if value=\"{{ makingProject }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ cancelProject }}\" style=\"position: fixed; inset: 0; z-index: 900; display: grid; place-items: center; padding: 48px; background: color-mix(in oklch, #f7f6f1 55%, transparent); backdrop-filter: blur(6px) saturate(1.1)\">\n          <div sc-camel-on-click=\"{{ stopClick }}\" style=\"width: min(440px, 100%); border: 1px solid #c4c1b6; border-radius: 12px; background: #fdfcf9; overflow: hidden; box-shadow: 0 1px 2px rgba(28,27,24,.04), 0 30px 70px -30px rgba(28,27,24,.30); animation: pop .22s cubic-bezier(.4,0,.2,1) both\">\n            <div style=\"padding: 16px 20px; border-bottom: 1px solid #e6e3da; display: flex; align-items: center; justify-content: space-between\">\n              <span style=\"font-size: 10.5px; letter-spacing: 0.22e  border-color .15s\">{{ d.check }}<\u002Fspan>\n                            <span style=\"flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ d.name }}/<\u002Fspan>\n                            <span style=\"font-size: 10px; color: #97948a; flex-shrink: 0\">{{ d.count }}<\u002Fspan>\n                          <\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-top: 1px solid #e6e3da; background: #f1efe8; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n              <span style=\"font-size: 10px; color: #97948a; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ pPreview }}<\u002Fspan>\n              <span style=\"display: flex; gap: 8px; flex-shrink: 0\">\n                <span sc-camel-on-click=\"{{ cancelProject }}\" style=\"font-size: 11px; color: #54524b; padding: 6px 12px; border-radius: 6px; cursor: pointer; border: 1px solid transparent\" style-hover=\"border-color: #e6e3da; background: #fdfcf9\">cancel<\u002Fspan>\n                <span sc-camel-on-click=\"{{ createProject }}\" style=\"font-size: 11px; border: 1px solid #1c1b18; background: #1c1b18; color: #f7f6f1; padding: 6px 14px; border-radius: 6px; cursor: pointer; opacity: {{ createOpacity }}\" style-hover=\"background: oklch(0.55 0.075 150); border-color: oklch(0.55 0.075 150)\">create<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ projSession }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"viewin\" style=\"display: flex; align-items: center; gap: 14px; padding: 18px 56px 22px; border-bottom: 1px solid #e6e3da; font-size: 12px; color: #54524b; flex-wrap: wrap\">\n      <span sc-camel-on-click=\"{{ backToIndex }}\" style=\"color: #97948a; font-size: 11px; margin-right: 4px; cursor: pointer\" style-hover=\"color: #1c1b18\">← projects<\u002Fspan>\n      <span style=\"display: inline-flex; align-items: center; gap: 4px\">\n        <sc-if value=\"{{ curRenaming }}\" hint-placeholder-val=\"{{ false }}\">\n          <input value=\"{{ renameText }}\" sc-camel-on-change=\"{{ onRenameText }}\" sc-camel-on-key-down=\"{{ onRenameKey }}\" sc-camel-on-blur=\"{{ commitRename }}\" sc-camel-auto-focus=\"{{ true }}\" sc-camel-spell-check=\"{{ false }}\" style=\"background: #fdfcf9; border: 1px solid oklch(0.55 0.075 150 / 0.35); border-radius: 5px; padding: 2px 7px; font-family: inherit; font-size: 12px; color: #1c1b18; outline: none; width: 200px\">\n        <\u002Fsc-if>\n        <sc-if value=\"{{ curNotRenaming }}\" hint-placeholder-val=\"{{ true }}\">\n          <b sc-camel-on-double-click=\"{{ startCurRename }}\" title=\"double-click to rename\" style=\"color: #1c1b18; font-weight: 500; cursor: text\">{{ curName }}<\u002Fb>\n        <\u002Fsc-if>\n        <span style=\"color: #c4c1b6; margin: 0 4px\">▸<\u002Fspan>{{ curTask }}<\u002Fspan>\n      <sc-if value=\"{{ chipRunning }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: oklch(0.55 0.075 150); border: 1px solid oklch(0.55 0.075 150 / 0.35); background: oklch(0.55 0.075 150 / 0.12); padding: 4px 10px; border-radius: 100px\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: oklch(0.55 0.075 150); animation: ping 2.4s cubic-bezier(.4,0,.2,1) infinite\"><\u002Fspan>running<\u002Fspan>\n        <sc-if value=\"{{ autoOn }}\" hint-placeholder-val=\"{{ false }}\"><span title=\"acting more autonomously\" style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing:  hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: oklch(0.66 0.085 75); border: 1px solid oklch(0.66 0.085 75 / 0.35); background: oklch(0.66 0.085 75 / 0.12); padding: 4px 10px; border-radius: 100px\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: oklch(0.66 0.085 75)\"><\u002Fspan>{{ chipPlanLabel }}<\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ chipIdle }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #97948a; border: 1px solid #e6e3da; background: #fdfcf9; padding: 4px 10px; border-radius: 100px\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: #c4c1b6\"><\u002Fspan>idle<\u002Fspan>\n      <\u002Fsc-if>\n      <span style=\"flex: 1\"><\u002Fspan>\n      <sc-if value=\"{{ showRunButton }}\" hint-placeholder-val=\"{{ false }}\">\n        <span data-tour=\"run\" style=\"position: relative; display: inline-flex; align-items: center; gap: 8px; border-radius: 100px\">\n          <span sc-camel-on-click=\"{{ planRun }}\" title=\"{{ runButtonTip }}\" style=\"display: inline-flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .04em; border: 1px solid oklch(0.55 0.075 150); background: oklch(0.55 0.075 150); color: #fdfcf9; padding: 8px 18px; border-radius: 100px; cursor: pointer; box-shadow: 0 1px 2px rgba(28,27,24,.06), 0 8px 22px -12px oklch(0.55 0.075 150 / 0.55)\" style-hover=\"background: #1c1b18; border-color: #1c1b18\"><span style=\"font-size: 9px\">▶<\u002Fspan>{{ runButtonLabel }}<\u002Fspan>\n          <sc-if value=\"{{ showAutoBtn }}\" hint-placeholder-val=\"{{ true }}\">\n            <span data-tour=\"auto\" sc-camel-on-click=\"{{ autoClick }}\" title=\"buddy acts more autonomously\" style=\"display: i les and memory. here's the lay of the land, in the order you'll use it.\", view: { view: \"desk\" } },\n  { t: \"settings\", eyebrow: \"team · step 1\", title: \"start with your team.\", body: \"first, tell {name} who it works with. it all starts in settings, up here.\", view: { view: \"desk\" } },\n  { t: \"teamcard\", eyebrow: \"team · step 2\", title: \"open team.\", body: \"the team card in settings. click it to see and change who can give {name} work.\", view: { view: \"desk\", settingsOpen: true } },\n  { t: \"teamtbl\", eyebrow: \"team\", title: \"who can give {name} work.\", body: \"your team lives here. a message from one of their verified handles becomes work it picks up on its own. from anyone else, it asks you first.\", view: { view: \"team\" } },\n  { t: \"teamhandles\", eyebrow: \"team · handles\", title: \"verified email and slack.\", body: \"each teammate's work email and slack handle. a handle only counts once it's verified, so nobody can spoof a teammate to hand {name} work.\", view: { view: \"team\" } },\n  { t: \"teamvia\", eyebrow: \"team · reach via\", title: \"how it gets back to them.\", body: \"pick where {name} reaches each person: email or slack. if they started the conversation, it replies right there. this is for everything else: questions or results it brings to them first.\", view: { view: \"team\" } },\n  { t: \"teamadd\", eyebrow: \"team · add\", title: \"add someone.\", body: \"name, work email, and slack if they use it. they get a link to verify, then they're on the team. only the workspace owner can add or remove people.\", view: { view: \"team\" } },\n  { t: \"nav\", eyebrow: \"the tabs\", title: \"five places, one job.\", body: \"desk, approvals, inbox, files and projects. you'll live mostly in projects; the rest show what's happening across all of them.\", view: { view: \"desk\" } },\n  { t: \"desk\", eyebrow: \"desk\", title: \"your daily view.\", body: \"what's waiting on you on the left, what {name} is doing in the middle, and your projects on the right.\", view: { view: \"desk\" } },\n  { t: \"todos\", eyebrow: \"desk · todos\", title: \"what it's working on.\", body: \"every task in flight, grouped by project, with how far along it is. amber means stuck: the line under it says what it needs, and clicking takes you there.\", view: { view: \"desk\" } },\n  { t: \"recur\", eyebrow: \"desk · recurring\", title: \"jobs that repeat.\", body: \"everything you've set to run on a schedule, and when it runs next. set one up in chat: \\\"every weekday at 8:30, triage the inbox.\\\"\", view: { view: \"desk\" } },\n  { t: \"later\", eyebrow: \"desk · scheduled\", title: \"tasks set for later.\", body: \"one-offs you've asked for on a date. {name} picks them up on the day, in the right project.\", view: { view: \"desk\" } },\n  { t: \"projgrid\", eyebrow: \"projects\", title: \"every job lives in a project.\", body: \"a project is the folders it can see plus the sessions that worked on them.\", view: { view: \"projects\", projView: \"index\" } },\n  { t: \"newproj\", eyebrow: \"new project\", title: \"start one with +.\", body: \"name it, then link existing folders or let it make a fresh one.\", view: { view: \"projects\", projView: \"index\" } },\n  { t: \"tabs\", eyebrow: \"inside a project\", title: \"chat on the left, work on the right.\", body: \"working files shows the folders this project is linked to. link or unlink more anytime, and drop files straight in.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\", tab: \"files\" } },\n  { t: \"run\", eyebrow: \"chat or plan\", title: \"two ways to start.\", body: \"just chat and it does what you ask. or press plan: {name} drafts a plan, waits for your yes, then runs it.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\" }, idle: true },\n  { t: \"auto\", eyebrow: \"auto\", title: \"plan, but always running.\", body: \"auto keeps {name} going on its own: it plans, acts and picks up the next thing without waiting on you. it checks in less, asks when it's stuck, and you can stop it anytime.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\" }, idle: true, tip: \"for the full experience, set {name} to auto.\" },\n  { t: \"toolchip\", eyebrow: \"tools in chat\", title: \"pick the apps for this session.\", body: \"the tools chip in the chat bar shows which connected apps this session can use.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\" } },\n  { t: \"toolpop\", eyebrow: \"tools in chat\", title: \"toggle them on or off.\", body: \"only what's on gets used. fewer tools keeps {name} focused, and the meter shows how many are loaded.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\", open: true } },\n  { t: \"comp\", eyebrow: \"computer\", title: \"a real computer, live.\", body: \"the computer tab is its screen. watch it click and type as it works.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\", tab: \"browser\" } },\n  { t: \"expand\", eyebrow: \"expand\", title: \"open it up.\", body: \"this opens the computer into the right side so you can see it properly.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\", tab: \"browser\" } },\n  { t: \"snap\", eyebrow: \"resize\", title: \"drag to make it bigger.\", body: \"pull this edge left to widen the screen. past half, it snaps to full and swallows the chat. a bubble stays in the corner so you can still talk.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\", tab: \"browser\", expanded: true } },\n  { t: \"takeover\", eyebrow: \"take over\", title: \"take the keys.\", body: \"double-click the screen or press take over. {name} pauses and watches. hand back and it knows what you did.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\", tab: \"browser\", expanded: true } },\n  { t: \"teach\", eyebrow: \"teach\", title: \"or show it how.\", body: \"press teach to do a task yourself while {name} watches and learns.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\", tab: \"browser\", expanded: true } },\n  { t: \"tnote\", eyebrow: \"teach · notes\", title: \"use the computer, and annotate as you go.\", body: \"you drive the computer while {name} watches every click. type here to explain what you're doing and why. notes go into the lesson, not the chat.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\" }, teachMode: true },\n  { t: \"trail\", eyebrow: \"teach · lesson notes\", title: \"your notes stay in view.\", body: \"each note sits here with the step and window it was typed in. drag the edge wider, or pull it away to hide.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\" }, teachMode: true },\n  { t: \"tpause\", eyebrow: \"teach · pause\", title: \"pause when you step away.\", body: \"nothing you do while paused goes into the lesson. resume when you're back and pick up where you left off.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\" }, teachMode: true },\n  { t: \"thand\", eyebrow: \"teach · hand back\", title: \"hand back when you're done.\", body: \"{name} writes the procedure from what you did and said. it lands in memory, where anyone can read or edit it.\", view: { view: \"projects\", projView: \"session\", cur: \"triage\" }, teachMode: true },\n  { t: \"inboxpage\", eyebrow: \"inbox\", title: \"its own address.\", body: \"your teammate gets its own email, [teammate]@[company].trybuddynow.com, built from the name you picked and your company name. cc it on a thread or @[teammate] in slack.\", view: { view: \"inbox\" } },\n  { t: \"ibroute\", eyebrow: \"inbox · routing\", title: \"one project gets the mail.\", body: \"every email and slack message lands in the project you pick here. change it anytime.\", view: { view: \"inbox\" } },\n  { t: \"iblist\", eyebrow: \"inbox · threads\", title: \"everything said outside the chat.\", body: \"email and slack threads, newest first. search every message, and unread threads read a little heavier.\", view: { view: \"inbox\" } },\n  { t: \"ibthread\", eyebrow: \"inbox · a thread\", title: \"the whole conversation, like a chat.\", body: \"every message in order, with from, to, cc and the subject a click away. earlier history folds up, and attachments open in files or download.\", view: { view: \"inbox\", ibOpen: \"i1\" } },\n  { t: \"ibreply\", eyebrow: \"inbox · reply\", title: \"reply from here.\", body: \"it goes out from your teammate's address, to everyone on the thread. reply all, forward, add bcc or attach files.\", view: { view: \"inbox\", ibOpen: \"i1\" } },\n  { t: \"files\", eyebrow: \"files\", title: \"everything it keeps.\", body: \"every folder across all projects, in one tree. drag files in, rename or delete, and open markdown right here. projects link to these folders; deleting a file can be undone.\", view: { view: \"files\" } },\n  { t: \"conn\", eyebrow: \"settings · connections\", title: \"connect your apps here.\", body: \"gmail, linear, github and more, as mcp connectors. connect once here, then toggle them per session from the chat bar. anything that sends, pays or deletes still waits for your yes.\", view: { view: \"desk\", settingsOpen: true } },\n  { t: \"slackbot\", eyebrow: \"settings · slack bot\", title: \"its own name in slack.\", body: \"add @{slug} to your workspace. people mention or dm it, and it replies as itself, not as you.\", view: { view: \"desk\", settingsOpen: true } },\n  { t: \"usage\", eyebrow: \"settings · usage\", title: \"see what it costs.\", body: \"usage & billing opens a full page for hours, cost and every run.\", view: { view: \"desk\", settingsOpen: true } },\n  { t: \"uhours\", eyebrow: \"usage · hours\", title: \"working hours.\", body: \"time only counts while {name} is on a task. chatting is free. pick day, week or month, and page back with the arrows.\", view: { view: \"settings\" } },\n  { t: \"cost\", eyebrow: \"usage · cost\", title: \"computer and labor, split out.\", body: \"computer is the machine being on. labor is the work itself: thinking, clicking, writing. both are shown for the window you picked. rates here are placeholders.\", view: { view: \"settings\" } },\n  { t: \"ledger\", eyebrow: \"usage · ledger\", title: \"every run, itemized.\", body: \"each run with its project, how it ended and the minutes it billed. failed work doesn't bill, and you can mark a run as didn't work.\", view: { view: \"settings\" } },\n  { t: \"billing\", eyebrow: \"usage · billing\", title: \"your plan and what it covers.\", body: \"the plan includes a set of working hours, plus storage and live sessions up to a cap. past your hours, top up at $5/hr, prepaid. cards and invoices are managed in stripe.\", view: { view: \"settings\" } },\n  { t: \"people\", eyebrow: \"memory · people\", title: \"who's who.\", body: \"everyone {name} has met or you've told it about: role, what they know, how to reach them. edit, merge or forget anyone.\", view: { view: \"memory\" } },\n  { t: \"procs\", eyebrow: \"memory · procedures\", title: \"how things are done here.\", body: \"teach a procedure from the computer, or write one yourself with + procedure: the steps in plain words, gotchas inline. every lesson and correction updates it, with versions and a track record. turn any of them off anytime.\", view: { view: \"memory\" } },\n  { t: \"fb\", eyebrow: \"tour\", title: \"this tour lives here.\", body: \"the ? in the corner opens feedback. tell us what's off whenever something is. press walkthrough in it to run this tour again.\", view: { view: \"desk\", fbOpen: true } },\n];\n\nconst TOUR_CH = [[\"start\", null], [\"team\", \"teamtbl\"], [\"desk\", \"nav\"], [\"projects\", \"projgrid\"], [\"plan & auto\", \"run\"], [\"tools\", \"toolchip\"], [\"computer\", \"comp\"], [\"teach\", \"teach\"], [\"inbox\", \"inboxpage\"], [\"files\", \"files\"], [\"settings\", \"conn\"], [\"usage\", \"usage\"], [\"memory\", \"people\"], [\"tour\", \"fb\"]]\n  .map(([name, t]) => ({ name, i: TOUR.findIndex((x) => x.t === t) })).filter((c) => c.i >= 0);\n\nconst TEAM_INV0 = [\n  { id: \"iv1\", name: \"lena park\", email: \"lena@northloop.io\", role: \"member\", status: \"pending\", sent: 3 },\n  { id: \"iv2\", name: \"\", email: \"omar@northloop.io\", role: \"member\", status: \"expired\", sent: 9 },\n  { id: \"iv3\", name: \"kai tan\", email: \"kai@northloop.io\", role: \"owner\", status: \"revoked\", sent: 5 },\n];\nconst ACCT0 = { name: \"nathaniel reyes\", emails: [{ v: \"nathaniel@northloop.io\", ok: true }, { v: \"nate.reyes@gmail.com\", ok: true }], primary: \"nathaniel@northloop.io\", signin: \"nathaniel@northloop.io\", slack: null };\n\nclass Component extends DCLogic {\n  state = { entered: false, greetIx: Math.floor(Math.random() * 6), land: { plan: \"proposed\", v: 2, ask: \"\", askText: \"\", control: false, triage: true, notes: false, tools: { Gmail: true, Slack: true, Linear: true }, appr: null }, plans: { triage: { phase: \"running\", v: 1, lastAsk: \"\", step: 7 } }, planAsk: \"\", composer: \"\", signedIn: false, authMode: \"in\", authName: \"\", authUser: \"\", authPass: \"\", open: false, on: { gmail: true, slack: true, linear: true }, tab: \"files\", expanded: false, view: \"desk\", dirs: { triage: true }, sel: \"triage/backlog.md\", drafts: {}, saved: {}, editing: false, dragging: false, added: [], folders: [], dropTarget: \"\", creating: false, newName: \"\", resolved: {}, projView: \"index\", projects: PROJECTS, cur: \"triage\", renaming: null, renameText: \"\", making: false, pName: \"\", pMode: \"new\", pDirs: {}, wfDirs: {}, wfLinking: false, wfDragging: false, wfDropTarget: \"\", fsRenaming: null, fsRenameText: \"\", renamedFiles: {}, renamedDirs: {}, fsDeleting: null, deleted: [], undo: null, compW: 560, compDrag: false, control: false, compSay: \"\", compSent: false, settingsOpen: false, gran: \"month\", off: 0, conn: { gmail: true, slack: true, linear: true, github: true, notion: true, \"google-calendar\": true } };\n\n  drop(list, into) {\n    const dir = into !== undefined ? into : this.state.dropTarget || \"\";\n    const names = [...(list || [])].map((f) => ({\n      path: (dir ? dir + \"/\" : \"\") + (f.name || \"untitled\"),\n      size: f.size || 0,\n      fresh: true,\n    }));\n    if (!names.length) return;\n    this.setState((st) => ({\n      added: st.added.concat(names),\n      dirs: dir ? { ...st.dirs, [dir]: true } : st.dirs,\n      sel: names[0].path,\n    }));\n  }\n\n  setLand(patch) {\n    this.setState((st) => ({ land: { ...st.land, ...patch } }));\n  }\n\n  landingVals() {\n    const L = this.state.land;\n    const ls = this.state.lsOffer || \"ask\";\n    const TOOLS = [\n      { name: \"Gmail\", n: 12 },\n      { name: \"Slack\", n: 9 },\n      { name: \"Linear\", n: 11 },\n      { name: \"GitHub\", n: 14 },\n      { name: \"Notion\", n: 10 },\n    ];\n    const used = TOOLS.reduce((a, t) => a + (L.tools[t.name] ? t.n : 0), 0);\n    const ratio = used / 52;\n    return {\n      lsAsk: ls === \"ask\", lsDone: ls !== \"ask\",\n      lsNote: ls === \"yes\" ? \"on it. the send will wait in approvals for your yes.\" : \"okay. i'll leave it and ask again tomorrow.\",\n      lsYes: () => this.setState({ lsOffer: \"yes\" }), lsNo: () => this.setState({ lsOffer: \"no\" }), lsReset: () => this.setState({ lsOffer: \"ask\" }),\n      lpProposed: L.plan === \"proposed\",\n      lpRevising: L.plan === \"revising\",\n      lpRunning: L.plan === \"running\",\n      lpRevised: L.plan === \"proposed\" && L.v > 2,\n      lpV: L.v,\n      lpPrev: L.v - 1,\n      lpAsk: L.ask,\n      lpAskText: L.askText,\n      onLpAsk: (e) => this.setLand({ askText: e.target.value }),\n      onLpAskKey: (e) => { if (e.key === \"Enter\") this.landRevise(); },\n      lpUpdate: () => this.landRevise(),\n      lpApprove: () => this.setLand({ plan: \"running\" }),\n      lpReset: () => this.setLand({ plan: \"proposed\", v: 2, ask: \"\" }),\n      lcChip: L.control ? \"you have control\" : \"buddy has control\",\n      lcChipColor: L.control ? \"oklch(0.55 0.075 250)\" : \"oklch(0.55 0.075 150)\",\n      lcChipLine: L.control ? \"oklch(0.55 0.075 250 / 0.35)\" : \"oklch(0.55 0.075 150 / 0.35)\",\n      lcChipFill: L.control ? \"oklch(0.55 0.075 250 / 0.12)\" : \"oklch(0.55 0.075 150 / 0.12)\",\n      lcFoot: L.control ? \"your clicks and keys go to the box. buddy watches.\" : \"view only. take over to interact.\",\n      lcBtn: L.control ? \"hand back\" : \"take over\",\n      lcBtnLine: L.control ? \"oklch(0.55 0.075 250)\" : \"#1c1b18\",\n      lcBtnFill: L.control ? \"oklch(0.55 0.075 250 / 0.12)\" : \"#1c1b18\",\n      lcBtnColor: L.control ? \"oklch(0.55 0.075 250)\" : \"#f7f6f1\",\n      lcToggle: () => this.setLand({ control: !L.control }),\n      lcTake: () => this.setLand({ control: true }),\n      lcRing: L.control ? \"inset 0 0 0 2px oklch(0.55 0.075 250 / 0.5)\" : \"none\",\n      lcCursor: L.control ? \"crosshair\" : \"default\",\n      lfTriageOpen: L.triage,\n      lfNotesOpen: L.notes,\n      lfTriageRot: L.triage ? \"90deg\" : \"0deg\",\n      lfNotesRot: L.notes ? \"90deg\" : \"0deg\",\n      lfToggleTriage: () => this.setLand({ triage: !L.triage }),\n      lfToggleNotes: () => this.setLand({ notes: !L.notes }),\n      ltUsed: used,\n      ltPct: Math.min(100, Math.round(ratio * 100)) + \"%\",\n      ltColor: ratio > 0.8 ? \"oklch(0.66 0.085 75)\" : \"oklch(0.55 0.075 150)\",\n      ltRows: TOOLS.map((t) => {\n        const on = !!L.tools[t.name];\n        const fits = on || t.n <= 52 - used;\n        return {\n          name: t.name,\n          check: on ? \"✓\" : \"\",\n          fill: on ? \"oklch(0.55 0.075 150)\" : \"#fdfcf9\",\n          line: on ? \"oklch(0.55 0.075 150)\" : \"#c4c1b6\",\n          color: on ? \"#1c1b18\" : \"#54524b\",\n          note: !fits ? \"would exceed the cap\" : t.n + \" tools\",\n          noteColor: on ? \"oklch(0.55 0.075 150)\" : \"#97948a\",\n          opacity
